<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sản phẩm - Pro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📦 Ứng dụng Quản lý Sản phẩm Pro</h1>
            <div id="stats" class="stats"></div>
        </header>

        <div class="main-content">
            <!-- Thêm/Sửa sản phẩm -->
            <section class="form-section">
                <h2>Thêm/Sửa Sản phẩm</h2>
                <form id="addProductForm" onsubmit="addProduct(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="productId">Mã sản phẩm *</label>
                            <input type="text" id="productId" required>
                        </div>
                        <div class="form-group">
                            <label for="productName">Tên sản phẩm *</label>
                            <input type="text" id="productName" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="productPrice">Giá (VND) *</label>
                            <input type="number" id="productPrice" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="productCategory">Loại</label>
                            <select id="productCategory">
                                <option value="Khác">Khác</option>
                                <option value="Điện tử">Điện tử</option>
                                <option value="Quần áo">Quần áo</option>
                                <option value="Thực phẩm">Thực phẩm</option>
                                <option value="Sách">Sách</option>
                                <option value="Mỹ phẩm">Mỹ phẩm</option>
                                <option value="Văn phòng">Văn phòng</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="productStock">Kho hàng</label>
                            <input type="number" id="productStock" min="0" value="0">
                        </div>
                        <div class="form-group">
                            <label for="productRating">Đánh giá (1-5)</label>
                            <input type="number" id="productRating" min="1" max="5" step="0.1" value="5">
                        </div>
                    </div>
                    <div class="form-group full-width">
                        <label for="productDesc">Mô tả</label>
                        <textarea id="productDesc" rows="3" placeholder="Mô tả sản phẩm..."></textarea>
                    </div>
                    <div class="button-group">
                        <button type="submit" class="btn btn-primary">✅ Thêm/Cập nhật</button>
                        <button type="button" class="btn btn-secondary" onclick="resetForm()">🔄 Làm mới</button>
                    </div>
                </form>
            </section>

            <!-- Tìm kiếm & Lọc -->
            <section class="filter-section">
                <h2>Tìm kiếm & Lọc</h2>
                <div class="filter-row">
                    <input type="text" id="searchInput" placeholder="🔍 Tìm kiếm theo tên..." onkeyup="searchProducts()">
                    <select id="categoryFilter" onchange="filterByCategory()">
                        <option value="">Tất cả loại</option>
                        <option value="Điện tử">Điện tử</option>
                        <option value="Quần áo">Quần áo</option>
                        <option value="Thực phẩm">Thực phẩm</option>
                        <option value="Sách">Sách</option>
                        <option value="Mỹ phẩm">Mỹ phẩm</option>
                        <option value="Văn phòng">Văn phòng</option>
                        <option value="Khác">Khác</option>
                    </select>
                </div>
            </section>

            <!-- Danh sách sản phẩm -->
            <section class="product-section">
                <h2>Danh sách Sản phẩm</h2>
                <div id="productCount" class="product-count"></div>
                <div id="productList" class="product-grid"></div>
            </section>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
